[tools]
hk = "2.3.0"
pkl = "0.32.1"
stylua = "2.5.2"
lua = "5.4.7"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.30.1"
typos = "1.50.3"

[hooks]
# luacheck doesn't publish binaries mise can install nicely, so install it via luarocks
postinstall = "luarocks install luacheck 1.2.0"

[tasks.setup]
run = "hk install"

[tasks.check]
run = "hk check --all"

[tasks.fix]
run = "hk fix --all"

[tasks.update-luacheckrc]
run = "curl -fsSL https://raw.githubusercontent.com/mpv-player/mpv/master/.luacheckrc -o .config/.luacheckrc"
